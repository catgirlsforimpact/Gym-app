<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Lift Log</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">

    </button>
  </header>

  <main id="view"></main>

  <nav class="tabs" aria-label="Main">
    <button data-tab="train" class="active">Train</button>
    <button data-tab="exercises">Exercises</button>
    <button data-tab="progress">Progress</button>
    <button data-tab="notes">Notes</button>
  </nav>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>

  <script src="data.js"></script>
  <script src="phrases.js"></script>
  <script src="app.js"></script>
</body>
</html>
